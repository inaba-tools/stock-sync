name: eBay即時通知の設定

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "setup（登録）／test（テスト送信）／usage（届いた回数を見る）"
        default: setup

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: inaba-tools/stock-sync-core   # 中身は非公開リポジトリ（読み取り専用キーで取る）
          token: ${{ secrets.CORE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python notify_setup.py "${{ inputs.mode }}" > "$RUNNER_TEMP/out.log" 2>&1 || { echo "失敗しました（記録は非公開）"; exit 1; }
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_KEY: ${{ secrets.SHEET_API_KEY }}
