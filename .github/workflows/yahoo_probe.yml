name: ヤフオク読み込みテスト（1回だけ・あとで削除）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, re
          for u in ["https://auctions.yahoo.co.jp/search/search?p=902KC&n=50", "https://auctions.yahoo.co.jp/jp/auction/s1227910334"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "stock-sync/1.0"}), timeout=30)
                  h = r.read().decode("utf-8", "ignore")
                  print(u, r.status, len(h), "NEXT_DATA" if "__NEXT_DATA__" in h else "NO_NEXT_DATA", len(re.findall(r'"auctionId"', h)))
              except Exception as e:
                  print(u, "ERROR", e)
          PY
