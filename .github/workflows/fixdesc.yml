name: 1回だけの作業

on:
  workflow_dispatch:          # 手動実行のみ

concurrency:
  group: oneoff
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: AIの確認で問題があった出品を終了（2026/11/01 本人の指示）
        run: |
          python monitor.py endids "366750944566:レンズエラー" "366742508340:本体ではなく基盤のみ" "366746391211:型番違いW30" "366750408871:揺れの不具合" "366758091018:上画面ライン不良" "366750001070:きせかえプレートのみ" "366750008805:故障・欠損" "366735368669:外装ダメージ大" "366742586782:電池カバー欠品・画面黄ばみ" "366746611474:ボタン・レンズカバー不良" "366749891517:申告と状態が違う" "366749999101:電池蓋欠損" "366750200586:申告と状態が違う" "366750300265:動作未確認ジャンク" "366750402947:フラッシュ故障" "366750404065:状態が非常に悪い" "366750406742:型番違いWX220" "366753050779:型番違いS50" "366753135070:きせかえプレートのみ" "366754799806:スライドパッド欠損" "366757204962:申告と状態が違う" "366759630498:起動時の不具合" "366762263353:液晶パーツのみ" "366765362564:上画面の液晶不良" "366765362986:上画面の縦線"
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_KEY: ${{ secrets.SHEET_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 無料枠のみ
