name: 1回だけの作業

on:
  workflow_dispatch:
    inputs:
      n:
        description: "何件まで"
        default: "200"          # 手動実行のみ

concurrency:
  group: oneoff
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: 出品中の商品のタイトル・説明をAIで作り直す（2026/11/01）
        run: |
          python monitor.py endids "366735983813:型番違い（V602SH）" "366754810072:型番違い（V602SH）" "366763480952:型番違い（V602SH）"
          python monitor.py retitle "366750409341=Sony Cyber-shot DSC-T70 8.1MP Digital Camera Silver Tested From Japan" "366775112042=Nikon COOLPIX S3300 16.0MP Digital Camera Silver Tested Working From Japan"
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_KEY: ${{ secrets.SHEET_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 無料枠のみ
