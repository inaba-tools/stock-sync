name: メルカリ在庫監視

on:
  schedule:
    - cron: "7,37 * * * *"   # 30分ごと（GitHubの混雑で数分〜十数分遅れることがあります）
  workflow_dispatch:          # 「Run workflow」ボタンで手動実行もできる

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 全部見る回を1回だけ起動（.github/full_scan_once があり、その日時以降にまだ手動実行していないとき）
        if: hashFiles('.github/full_scan_once') != ''
        continue-on-error: true
        run: |
          since=$(cat .github/full_scan_once)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/discover.yml/runs?event=workflow_dispatch&created=%3E%3D${since}" --jq '.total_count')
          echo "全部見る回の実行回数（${since}以降）：${n}"
          if [ "$n" = "0" ]; then gh workflow run discover.yml -R "${{ github.repository }}" -f full=true; echo "全部見る回を起動しました"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ブラウザのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium
      - name: 写真の記録のキャッシュ（同じ商品の見分けに使う）
        uses: actions/cache@v4
        with:
          path: .cache
          key: imghash-${{ github.run_id }}
          restore-keys: imghash-

      - name: 監視を実行
        run: python monitor.py
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_KEY: ${{ secrets.SHEET_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: 自動実行が60日で止まらないようにする
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
