<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ハコペン">
<meta name="theme-color" content="#070908">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=bg2">
<link rel="icon" href="icon-192.png">
<title>ハコペン</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f4f3ef;--card:#fff;--text:#1d1d1b;--sub:#6b6a66;--line:rgba(0,0,0,.08);--acc:#0a7d5a;--accbg:#e1f5ee;--warn:#a35a00;--warnbg:#fdf1dc;--red:#b3261e;--redbg:#fce8e6;--blue:#185fa5;--bluebg:#e6f1fb}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1e1e1c;--text:#f1f0ec;--sub:#a3a29c;--line:rgba(255,255,255,.1);--acc:#5dcaa5;--accbg:#0c3a2d;--warn:#f0b35a;--warnbg:#3a2a10;--red:#f19a92;--redbg:#3d1714;--blue:#85b7eb;--bluebg:#0f2a45}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#scroll{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
input,textarea{-webkit-user-select:text;user-select:text}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:26px;font-weight:700;margin:4px 0 14px}
h2{font-size:15px;font-weight:600;color:var(--sub);margin:22px 0 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border:.5px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:13px;color:var(--sub)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.ok{background:var(--acc);border-color:var(--acc)}
button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:9px 16px;background:var(--text);color:var(--card);cursor:pointer;flex:none}
button.sub{background:var(--bg);color:var(--text);border:.5px solid var(--line)}
button:disabled{opacity:.4}
input,textarea{font:inherit;font-size:16px;border:.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);color:var(--text);width:100%}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.tag.ok{background:var(--accbg);color:var(--acc)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.red{background:var(--redbg);color:var(--red)}.tag.blue{background:var(--bluebg);color:var(--blue)}
.big{font-size:44px;font-weight:700;line-height:1.15;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--card);border-radius:16px;padding:12px 14px;border:.5px solid var(--line)}
.mini b{display:block;font-size:24px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:.5px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav a{flex:1;text-align:center;font-size:11px;color:var(--sub);text-decoration:none;position:relative}
nav a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav a.on{color:var(--acc)}
nav .badge{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:0 6px;line-height:17px}
.bubble{max-width:82%;padding:10px 13px;border-radius:18px;margin:6px 0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.en{font-size:12px;opacity:.75;margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:28px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
a.lnk{color:var(--blue);text-decoration:none}
.back{background:none;color:var(--acc);padding:4px 0;font-size:16px}
.sticky{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 74px);background:var(--bg);padding:8px 0}
.hide{display:none}

:root{--ease:cubic-bezier(.22,.8,.24,1)}
#app.enter{animation:pg .26s var(--ease)}
@keyframes pg{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button,.card[onclick],.lrow,nav a,.chip{transition:transform .16s var(--ease),opacity .16s,background-color .2s}
button:active,.card[onclick]:active,.lrow:active,.chip:active{transform:scale(.96)}
nav a:active{transform:scale(.9)}
nav a.on svg{animation:pop .38s var(--ease)}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
nav a{-webkit-touch-callout:none;padding:4px 0}
.toast{transform:translate(-50%,12px);transition:opacity .22s var(--ease),transform .22s var(--ease)}
.toast.on{transform:translate(-50%,0)}
#pbar{position:fixed;top:env(safe-area-inset-top);left:0;height:2px;width:0;background:var(--acc);z-index:20;opacity:0;transition:opacity .2s}
#pbar.on{opacity:1;animation:pb 1.2s var(--ease) infinite}
@keyframes pb{0%{width:0;left:0}50%{width:60%;left:20%}100%{width:0;left:100%}}
/* トーク：LINEのブラック風 */
body.talk{--bg:#000;--card:#111;--text:#f2f2f2;--sub:#9a9a9f;--line:#262628;--acc:#4cbf5e;--red:#ff6b5e;color-scheme:dark}
body.talk nav{background:#000}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:.5px solid var(--line);cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:#3a3a3c;color:#f2f2f2;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.av.sm{width:34px;height:34px;font-size:14px;align-self:flex-start}
.meta{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tm{font-size:11px;color:var(--sub)}
.unread{background:var(--acc);color:#0d1a0f;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;line-height:19px;padding:0 6px;text-align:center}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh{position:sticky;top:0;z-index:3;margin:calc(-1 * (env(safe-area-inset-top) + 16px)) -16px 0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#111;display:flex;align-items:center;gap:8px;border-bottom:.5px solid var(--line)}
.rh .back{font-size:26px;line-height:1;padding:2px 8px;color:#f2f2f2}
.item{display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:10px 12px;background:#1c1c1e;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:#2c2c2e;color:#f2f2f2;text-decoration:none;white-space:nowrap}
.chip.g{background:var(--acc);color:#0d1a0f}
.day{text-align:center;margin:14px 0 6px}.day span{background:rgba(255,255,255,.13);color:#e8ecf2;font-size:12px;padding:4px 12px;border-radius:999px}
.msg{display:flex;align-items:flex-end;gap:6px;margin:6px 0;animation:bin .3s var(--ease) both}
.msg.me{justify-content:flex-end}
@keyframes bin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg .bubble{margin:0;max-width:74%;border:0;border-radius:18px;padding:8px 13px;line-height:1.5}
.msg.them .bubble{background:#2c2c2e;color:#f2f2f2;border-top-left-radius:4px}
.msg.me .bubble{background:#3f9d4b;color:#f3fff1;border-top-right-radius:4px}
.msg time{font-size:10.5px;color:var(--sub);flex:none;margin-bottom:2px;text-align:right;line-height:1.3}
.bubble .en{font-size:12px;opacity:.7;margin-top:5px;padding-top:5px;border-top:.5px solid rgba(255,255,255,.18)}
body.room nav{display:none}
body.room main{padding-bottom:calc(env(safe-area-inset-bottom) + 150px)}
.ibar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#111;border-top:.5px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.ibar .in{max-width:560px;margin:0 auto}
.ibar textarea{background:#1c1c1e;border:0;border-radius:20px;resize:none;max-height:140px;line-height:1.45;padding:9px 14px}
.pre{font-size:12px;color:var(--sub);margin:0 6px 6px;white-space:pre-wrap;max-height:84px;overflow:auto}
.pre b{color:#f2f2f2;font-weight:600}
.sendb{background:var(--acc);color:#0d1a0f;width:40px;height:40px;padding:0;display:grid;place-items:center;flex:none}
.sw{position:relative;overflow:hidden}
.swbg{position:absolute;inset:0;display:flex;align-items:center;padding-left:18px;background:#1c3a24;color:#7fd99a;font-size:13px;font-weight:700;transition:background .15s}
.sw.go .swbg{background:var(--acc);color:#0d1a0f}
.sw .lrow{position:relative;background:var(--bg);transition:transform .25s var(--ease)}

.chip.red{background:#e5484d;color:#fff}.chip.blue{background:#2f7cf6;color:#fff}
.msg.pend .bubble{opacity:.75}
.steps{display:flex;margin:12px 0 6px;gap:0}
.st{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--sub)}
.st i{display:block;width:12px;height:12px;border-radius:50%;margin:0 auto 4px;background:var(--line);position:relative;z-index:1;transition:background .3s}
.st::before{content:"";position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::before{display:none}
.st.done i,.st.now i{background:var(--acc)}.st.done::before,.st.now::before{background:var(--acc)}
.st.now i{box-shadow:0 0 0 4px var(--accbg);animation:pulse 1.6s ease-in-out infinite}
.st.now span{color:var(--text);font-weight:600}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
/* 2026/11/14 引っ張って更新はXと同じ動き：一覧ごと指についてきて、上の隙間に矢印→離すとくるくる→終わったらスッと戻る */
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;margin-left:-14px;width:28px;height:28px;opacity:0;z-index:8;display:grid;place-items:center;color:var(--sub);pointer-events:none}
#ptr .ar{transition:transform .18s ease}#ptr.over .ar{transform:rotate(180deg)}
#ptr .sp{display:none;color:var(--acc)}#ptr.spin .ar{display:none}#ptr.spin .sp{display:block;animation:rot .75s linear infinite}
#ptr.back,#app.ptrback{transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .2s}
@keyframes rot{to{transform:rotate(360deg)}}

.rtag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px}
.rtag.no{background:#5a2626;color:#ff8a80}.rtag.wait{background:#4a3d16;color:#f0c75a}.rtag.ok{background:#22302a;color:#7fd99a}
.mswipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;-webkit-overflow-scrolling:touch}
.mswipe::-webkit-scrollbar{display:none}
.mp{flex:0 0 100%;scroll-snap-align:center;padding:4px 16px 0;box-sizing:border-box}
.mtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.mtabs::-webkit-scrollbar{display:none}
.mt{background:var(--card);color:var(--sub);border:.5px solid var(--line);padding:6px 14px;font-size:13px}
.mt.on{background:var(--text);color:var(--card)}

.totb{text-align:right;flex:none;padding-bottom:6px}.totb b{display:block;font-size:17px}
.mini.tap{cursor:pointer;transition:transform .16s var(--ease)}.mini.tap:active{transform:scale(.96)}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,0);pointer-events:none;transition:background .25s}
#sheet.on{background:rgba(0,0,0,.5);pointer-events:auto}
#shb{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .32s var(--ease);max-width:560px;margin:0 auto}
#sheet.on #shb{transform:none}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.shh .t{font-size:18px}
.x{background:var(--card);color:var(--text);padding:6px 11px;border:.5px solid var(--line)}
.dl{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:.5px solid var(--line);font-size:15px}.dl.sum{border-bottom:0;font-size:16px}.dl.sum b{font-size:18px}
.dl2{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--sub)}
.skip{background:none;color:var(--sub);border:.5px solid var(--line);font-size:11px;padding:3px 10px;margin-left:8px;vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ホーム：路線図 */
body.home-on #scroll{overflow:hidden}
.home{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 104px)}
.hhead{display:flex;align-items:flex-start;gap:10px;margin:2px 0 10px}
.hnum{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}.hnum.neg{color:var(--red)}
.addx{display:flex;align-items:center;gap:4px;background:var(--accbg);color:var(--acc);padding:9px 14px}
.route{position:relative;display:flex;margin:4px -6px 2px;padding-bottom:8px}
.rline{position:absolute;left:10%;right:10%;top:21px;height:2px;background:var(--line);z-index:0}
.rbar{position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:var(--acc);transition:transform .35s var(--ease),width .35s var(--ease)}
.stop{flex:1;background:none;color:var(--sub);padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;z-index:1;border-radius:0}
.dotc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:.5px solid var(--line);transition:transform .3s var(--ease),box-shadow .3s}
.dotc b{font-size:17px;color:var(--text)}
.stop.me .dotc{background:var(--accbg);color:var(--acc);border-color:transparent}.stop.me .dotc b{color:var(--acc)}
.stop.on{color:var(--text)}.stop.on .dotc{transform:scale(1.12);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--acc)}
.stop.me .dotc b{animation:pulseN 2s ease-in-out infinite}
@keyframes pulseN{50%{transform:scale(1.15)}}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);margin:4px 2px 8px}
.lg{width:10px;height:10px;border-radius:50%;background:var(--card);border:.5px solid var(--line);margin-left:6px}.lg.me{background:var(--acc);border:0;margin-left:0}
.rswipe{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rswipe::-webkit-scrollbar{display:none}
.rp{flex:0 0 100%;scroll-snap-align:center;padding:0 16px 8px;overflow-y:auto;box-sizing:border-box}
.rph{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;margin:2px 2px 8px}
.ci{animation:cin .42s var(--ease) both}
@keyframes cin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.card.out{animation:cout .38s var(--ease) forwards}
@keyframes cout{to{opacity:0;transform:translateX(70%) rotate(3deg)}}
.act{margin-top:10px;justify-content:flex-end;gap:8px}
.act input{flex:1}
.ok-mark{color:var(--acc)}
details.more summary{list-style:none;text-align:center;font-size:13px;color:var(--acc);padding:8px;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{display:none}
details.more[open] .card{animation:cin .35s var(--ease) both}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ck{background:var(--card);color:var(--text);border:.5px solid var(--line);padding:7px 13px}
.ck.on{background:var(--acc);color:#fff;border-color:transparent;animation:pop .3s var(--ease)}
.bigin{font-size:24px;font-weight:700;padding:10px 14px}
.stepper{display:flex;align-items:center;gap:8px}.stepper b{min-width:44px;text-align:center;font-size:18px}
.stepper button{width:38px;height:38px;padding:0}
.seg{display:flex;gap:6px}.seg button{flex:1;background:var(--card);color:var(--text);border:.5px solid var(--line)}.seg button.on{background:var(--text);color:var(--card)}

/* ネテルマニに合わせる（色・書体・大きさ）2026/11/12 */
:root{--bg:#FFFFFF;--card:#FFFFFF;--field:#EEF2F1;--panel:#F4F6F5;--text:#1D2B2A;--sub:#566563;--line:#E0E6E4;--line2:#CBD5D3;
  --acc:#2F6460;--onacc:#FFFFFF;--accbg:#DDEBE9;--warn:#8A5426;--warnbg:#F6EBDD;--red:#C62F26;--redbg:#FBE9E7;--blue:#2B4E8C;--bluebg:#E4ECF7;
  --font:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--card:#151918;--field:#1E2423;--panel:#0E1111;--text:#F1F4F3;--sub:#A3B0AD;--line:#232A29;--line2:#34403E;
  --acc:#4FD1C5;--onacc:#0B0F0E;--accbg:rgba(79,209,197,.16);--warn:#C98A3E;--warnbg:rgba(201,138,62,.16);--red:#E5484D;--redbg:rgba(229,72,77,.16);--blue:#8FB2EE;--bluebg:rgba(143,178,238,.14)}}
html,body{font:14px/1.6 var(--font);letter-spacing:.01em}
h1{font-size:17px;font-weight:600;margin:6px 0 14px}
h2{font-size:13px;font-weight:600}
b,strong{font-weight:600}
.t{font-size:14px;font-weight:500}
.s{font-size:12.5px}
.card{border-radius:14px;border:1px solid var(--line);padding:12px 14px}
button{font-size:13px;font-weight:600;border-radius:10px;min-height:36px;padding:0 14px;background:var(--acc);color:var(--onacc)}
button.sub{background:var(--card);color:var(--text);border:1px solid var(--line2);font-weight:500}
button:active{transform:scale(.95)}
input,textarea{font:14px var(--font);background:var(--field);border:0;border-radius:12px;color:var(--text)}
nav{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:1px solid var(--line)}
nav a{font-size:10.5px}nav a.on{color:var(--acc);font-weight:600}
nav a svg{width:23px;height:23px}
nav .badge{background:var(--red);font-size:10px;line-height:16px;font-weight:600}
.tag{font-size:11px;font-weight:600;border-radius:6px}
.big{font-weight:600}.mini b{font-weight:600}
.hnum{font-size:28px;font-weight:600;letter-spacing:0}
.addx{background:var(--acc);color:var(--onacc);border-radius:12px}
.dotc{border:1px solid var(--line);background:var(--card)}
.dotc b{font-size:15px;font-weight:600}
.stop{font-size:10.5px}
.stop.me .dotc{background:var(--accbg);color:var(--acc)}
.rph{font-size:14px;font-weight:600}
.ck{border-radius:10px;font-weight:500;background:var(--field);border:0}
.ck.on{background:var(--acc);color:var(--onacc)}
.seg{background:var(--field);padding:4px;border-radius:14px;gap:4px}
.seg button{background:none;color:var(--sub);border:0;font-weight:500}
.seg button.on{background:var(--acc);color:var(--onacc);font-weight:600}
.mt{border-radius:10px;font-weight:500}.mt.on{background:var(--acc);color:var(--onacc)}
.toast{background:#3A3A3C;color:#fff;border-radius:14px;font-size:12.5px}
#shb{background:var(--bg);border-radius:20px 20px 0 0}
.x{border-radius:10px;font-weight:500}
.unread{font-weight:600}
.empty{font-size:13px}
.lg.me{background:var(--acc)}

/* いろんな色：段ごと・区分ごと 2026/11/12 */

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const br = s => esc(s).replace(/。(?!$)/g, "。<br>");
const yen = v => { const n = Number(String(v ?? "").replace(/[^\d.\-]/g, "")); return isFinite(n) ? n : 0; };
const fmt = n => (n < 0 ? "−" : "") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");
const truthy = v => v === true || String(v).toUpperCase() === "TRUE";
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),2400); }

// ---- 管理表との窓口（Googleでログインした持ち主だけ。通行証はこの端末にだけ保存） ----
const VERSION = "2026-11-14f";
const API_URL = "https://script.google.com/macros/s/AKfycbyZHCgZsDWaMxdtBcM_Iy_O3Z9Rda9OjFRaECV3_wR2HqINyjaaBj6e60tzY1rboMZQbg/exec";
const CLIENT_ID = "944595939498-b4ei4dlbcuap8v4o0ellepfj41m4j3j8.apps.googleusercontent.com";
const ss = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
async function post(body) {
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) });
  return r.json();
}
async function call(action, payload = {}) {
  const d = await post({ action, payload, session: ss.get("session") });
  if (d.login) { ss.set("session", null); location.hash = "settings"; throw new Error("ログインが切れました。設定タブからログインしてください"); }
  if (d.error) throw new Error(d.error);
  return d;
}
async function onGoogle(res) {
  try {
    const d = await post({ action: "login", idToken: res.credential });
    if (d.error) throw new Error(d.error);
    ss.set("session", d.session); ss.set("session_at", new Date().toLocaleDateString("ja-JP"));
    toast("ログインしました"); location.hash = "home"; render(true);
  } catch (e) { toast(e.message); }
}
async function testPrint() {
  try { await call("tab_set", { name: "売上", cells: [[4, 28, true]] }); toast("5分以内にMacで印刷します"); } catch (e) { toast(e.message); }
}
async function logout() {
  try { await post({ action: "logout", session: ss.get("session") }); } catch (e) {}
  ss.set("session", null); Object.keys(cache).forEach(k => { delete cache[k]; ss.set("c:" + k, null); }); toast("ログアウトしました"); render();
}
let gInit = false;
function googleButton(id) {
  const tryIt = () => {
    if (!(window.google && google.accounts && google.accounts.id)) return setTimeout(tryIt, 300);
    const el = document.getElementById(id); if (!el || el.dataset.done) return;
    if (!gInit) { google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogle, ux_mode: "popup" }); gInit = true; }
    el.dataset.done = "1";
    google.accounts.id.renderButton(el, { theme: "outline", size: "large", shape: "pill", text: "signin_with", locale: "ja", width: 260 });
  };
  tryIt();
}
function labelCard() {
  const v = (cache["売上"] && cache["売上"].v) || [], g = (r, col) => Number(String(c(v[r - 1], col)).trim() || 0);
  const ud = g(3, 26), lr = g(4, 26), pos = g(3, 28) || 1;
  return `<div class="card"><div class="t">ラベルの印刷</div><div class="s" style="margin-bottom:12px">シールの位置がずれたら、ここで直します。<br>単位はmmです。</div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><span>縦（下へ＋）</span><div class="stepper"><button class="sub" onclick="nudge(3,26,-1)">−</button><b id="v3_26">${ud}</b><button class="sub" onclick="nudge(3,26,1)">＋</button></div></div>
    <div class="row" style="justify-content:space-between;margin-bottom:12px"><span>横（右へ＋）</span><div class="stepper"><button class="sub" onclick="nudge(4,26,-1)">−</button><b id="v4_26">${lr}</b><button class="sub" onclick="nudge(4,26,1)">＋</button></div></div>
    <div class="s" style="margin-bottom:6px">次に貼るシールの位置</div>
    <div class="seg">${[1, 2, 3, 4].map(n => `<button class="${n === pos ? "on" : ""}" onclick="setPos(${n},this)">${n}</button>`).join("")}</div>
    <button class="sub" style="width:100%;margin-top:14px" onclick="testPrint()">テスト印刷（位置の確認用）</button></div>`;
}
async function nudge(r, col, d) {
  const e = $(`#v${r}_${col}`), n = Number(e.textContent) + d; e.textContent = n; e.animate([{ transform: "scale(1.3)" }, { transform: "none" }], 250);
  try { await setCells("売上", [[r, col, n]]); } catch (er) { toast(er.message); }
}
async function setPos(n, b) {
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
  try { await setCells("売上", [[3, 28, n]]); toast(`次は${n}番目のシールに印刷します`); } catch (er) { toast(er.message); }
}
async function viewSettings() {
  const on = !!ss.get("session");
  // 2026/11/13 設定を軽く：読み込みを待たずにすぐ出す。前回のデータが無いシートは裏で読んで、届いたら描き直す
  if (on) { ["通知", "買い手メッセージ", "除外者リスト", "経費"].forEach(n => (cache[n] ? tab(n) : refreshBg(n)).catch(() => {})); if (bell == null) bellState(); }
  return `<h1>設定</h1>
  ${on ? notifyCard() + expCard() + hiddenCard() + blockCard() : ""}
  <div class="card">${on ? `<div class="t">ログイン中</div><div class="s">${esc(ss.get("session_at") || "")}にログイン。<br>30日たつと、もう一度ログインが必要です。</div>
    <div style="margin-top:12px"><button class="sub" onclick="logout()">ログアウト</button></div>`
    : `<div class="t">Googleでログイン</div><div class="s" style="margin-bottom:12px">管理表の持ち主のアカウントでログインしてください。<br>ほかのアカウントでは使えません。</div><div id="gbtn" style="width:260px;height:44px;overflow:hidden"></div>`}</div>
  ${on ? labelCard() : ""}
  <div class="s" style="text-align:center;margin-top:16px">ハコペン ${VERSION}</div>`;
}
const cache = {};
["売上", "買い手メッセージ", "無在庫商品リスト", "月別収支", "ジャンク品在庫", "通知", "カメラ出品", "経費", "除外者リスト"].forEach(n => { try { const x = JSON.parse(ss.get("c:" + n) || "null"); if (x) cache[n] = x; } catch (e) {} });
const pending = {};
// 2026/11/12 読み込みを軽く：使う列までだけ読む・前回と同じなら中身は来ない（etag）
// 無在庫商品リストはほぼ全行が出品中で、トークの商品名さがしにも使うので行は絞らない
const READ_OPT = {
  "売上": { cols: 32 },
  "買い手メッセージ": { cols: 12 },
  "無在庫商品リスト": { cols: 23 },
};
// 2026/11/14 本人「重い」：同時に頼まれた読み込みは、少しだけ待って1回の通信にまとめる
// （シートごとに別々に同時に呼ぶとGoogle側で渋滞し、1件8〜9秒かかっていた。まとめると1回1〜2秒）
const bq = { list: [], t: null };
function tabReq(name) {
  const hit = bq.list.find(x => x.name === name);
  if (hit) return hit.p;
  let ok, ng; const p = new Promise((a, b) => { ok = a; ng = b; });
  const old = cache[name];
  bq.list.push({ name, q: Object.assign({ name, etag: old && old.etag }, READ_OPT[name] || {}), p, ok, ng });
  if (!bq.t) bq.t = setTimeout(async () => {
    const list = bq.list; bq.list = []; bq.t = null;
    try {
      const res = await call("tabs_get", { list: list.map(x => x.q) });
      list.forEach(x => { const r = (res.tabs || {})[x.name]; r && !r.error ? x.ok(r) : x.ng(new Error((r && r.error) || "読めませんでした")); });
    } catch (e) {
      if (!/知らない操作/.test(e.message)) return list.forEach(x => x.ng(e));
      list.forEach(x => call("tab_get", x.q).then(x.ok, x.ng));   // 古い輸出帳のときは1件ずつ
    }
  }, 30);
  return p;
}
function applyTab(name, res) {
  const old = cache[name];
  if (res.same && old) { old.at = Date.now(); ss.set("c:" + name, JSON.stringify(old)); return false; }
  const v = res.values || [];
  cache[name] = { at: Date.now(), v, etag: res.etag };
  ss.set("c:" + name, JSON.stringify(cache[name]));
  return !old || JSON.stringify(old.v) !== JSON.stringify(v);
}
async function fetchTab(name) {
  const old = cache[name];
  const res = await tabReq(name);
  if (res.same && old) { old.at = Date.now(); ss.set("c:" + name, JSON.stringify(old)); return false; }
  const v = res.values || [];
  cache[name] = { at: Date.now(), v, etag: res.etag };
  ss.set("c:" + name, JSON.stringify(cache[name]));
  return !old || JSON.stringify(old.v) !== JSON.stringify(v);
}

async function load(fresh) {

function prYm() { const v = ($("#pr_ym") || {}).value || "", m = v.match(/^(\d{4})-(\d{2})$/); return m; }
let pdfFile = null;
async function savePdf(kind, btn) {
  const m = prYm(); if (!m) { toast("年月を選んでください"); return; }
  const old = btn.textContent; btn.disabled = true; btn.textContent = "作っています…";
  try {
    const r = await call("pdf", { kind, ym: `${m[1]}/${m[2]}` });
    const b = atob(r.b64), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    pdfFile = new File([u], r.name, { type: "application/pdf" });
    const url = URL.createObjectURL(pdfFile);
    // 共有画面は押した直後でないと開けないので、できあがったらもう一度押してもらう
    $("#pr_out").innerHTML = `<div class="card" style="margin-top:14px;padding:14px 16px"><div>${esc(r.name)}</div><div class="s">${r.n}件</div>
      <div class="row" style="gap:8px;margin-top:10px"><button class="full grow" style="height:44px" onclick="sharePdf()">保存する</button>
      <a href="${url}" target="_blank" rel="noopener"><button class="sub" style="height:44px;padding:0 16px">開いて見る</button></a></div></div>`;
  } catch (e) { toast("PDFを作れませんでした：" + e.message); }
  finally { btn.disabled = false; btn.textContent = old; }
}
async function sharePdf() {
  if (!pdfFile) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) { await navigator.share({ files: [pdfFile] }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(pdfFile); a.download = pdfFile.name; document.body.appendChild(a); a.click(); a.remove();
}
function saveCsv(all) {   // 2026/11/13 収支の書き出し（MAXBETの書き出しと同じ役目）。日付・種類・内容・利益

      <div class="row" style="gap:8px"><button class="sub grow" onclick="testBell()">テスト表示</button><button class="sub grow" onclick="bellOff()">この端末はオフ</button></div>`
    : `<button style="width:100%;height:46px" onclick="bellOn()">この端末で通知を受け取る</button>${sa ? "" : `<div class="s" style="margin-top:8px">ホーム画面に追加したハコペンから押してください。</div>`}`}`;
}
function notifySheet() { if ($("#sheet.on")) $("#shb").innerHTML = notifyBody(); else sheetOpen(notifyBody()); }
async function setKind(r, b) {
  const on = !b.classList.contains("on"); b.classList.toggle("on", on);
  try { await setCells("通知", [[r, 2, on]]); } catch (e) { b.classList.toggle("on", !on); toast(e.message); }
}
async function bellOn() {
  const sa = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  if (!("PushManager" in window) || !sa) return toast("ホーム画面に追加したハコペンから押してください");
  try {
    if (await Notification.requestPermission() !== "granted") return toast("通知が許可されませんでした");
    const r = swReg || await navigator.serviceWorker.ready;
    let sub = await r.pushManager.getSubscription();
    if (!sub) sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
    const v = await tab("通知", true), json = JSON.stringify(sub.toJSON());
    let n = v.findIndex((x, i) => i >= 9 && String(c(x, 3)).includes(sub.endpoint)) + 1;
    if (n < 10) { n = v.findIndex((x, i) => i >= 9 && !String(c(x, 3)).trim()) + 1; if (n < 10) n = Math.max(10, v.length + 1); }
    const d = new Date(), dev = /iPad/.test(navigator.userAgent) ? "iPad" : /iPhone/.test(navigator.userAgent) ? "iPhone" : /Mac/.test(navigator.userAgent) ? "Mac" : "その他";
    await setCells("通知", [[n, 1, `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`], [n, 2, dev], [n, 3, json]]);
    bell = true; toast("通知がつながりました"); notifySheet();
  } catch (e) { toast("通知の登録に失敗しました"); }
}
async function bellOff() {
  try {
    const sub = await mySub();
    if (sub) {
      const v = await tab("通知", true), n = v.findIndex((x, i) => i >= 9 && String(c(x, 3)).includes(sub.endpoint)) + 1;
      if (n >= 10) await setCells("通知", [[n, 1, ""], [n, 2, ""], [n, 3, ""]]);
      await sub.unsubscribe();
    }
    bell = false; toast("この端末の通知をオフにしました"); notifySheet();
  } catch (e) { toast("オフにできませんでした"); }
}
async function testBell() {
  try { const r = swReg || await navigator.serviceWorker.ready; await r.showNotification("ハコペン", { body: "通知はこのように届きます。", icon: "icon-180.png", tag: "test" }); }
  catch (e) { toast("表示できませんでした"); }
}
// ---- 画面の切り替え（最後に押したタブだけを表示。読み込み中でも押せる） ----
let seq = 0;
function build(t, arg, fresh) {
  if (t === "settings" && arg === "hidden") { hiddenView = true; return viewChat(0, fresh); }   // 非表示のトークは設定から（2026/11/12）
  return t === "settings" ? viewSettings() : t === "stock" ? viewStock(fresh) : t === "chat" ? ((hiddenView = false), viewChat(arg && arg !== "hidden" ? Number(arg) : 0, fresh))
    : t === "money" ? viewMoney(fresh) : viewTodo(fresh);
}
async function render(fresh, keepFocus) {
  let [t, arg] = (location.hash.slice(1) || "home").split("/");
  if (t === "todo" || t === "list") t = "home";
  const logged = !!ss.get("session");
  $("#nav").classList.toggle("hide", !logged);
  if (!logged) {   // ログインするまではタブを出さず、ログイン画面だけ
    document.body.classList.remove("talk", "room");
    if ($("#gbtn")) return;
    $("#app").innerHTML = `<div style="min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
      <picture><source srcset="icon-dark.png" media="(prefers-color-scheme: dark)"><img src="icon.png" alt="" style="width:96px;height:96px;border-radius:22px;margin-bottom:16px"></picture>
      <h1 style="margin:0 0 6px">ハコペン</h1>
      <div class="s" style="margin-bottom:24px">管理表の持ち主のアカウントでログインしてください。<br>ほかのアカウントでは使えません。</div>
      <div id="gbtn" style="width:260px;height:44px;overflow:hidden"></div></div>`;
    googleButton("gbtn");
    return;
  }
  const my = ++seq, view = t + "/" + (arg || "");
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.t === t));
  document.body.classList.toggle("talk", t === "chat" || (t === "settings" && arg === "hidden"));
  document.body.classList.toggle("home-on", t === "home" || t === "stock" || t === "money");
  document.body.classList.toggle("stock-on", t === "stock");
  document.body.classList.toggle("room", t === "chat" && !!arg);
  const slow = setTimeout(() => { if (my === seq) $("#pbar").classList.add("on"); }, 120);
  try {
    const h = await build(t, arg, fresh);
    if (my !== seq) return;           // もっと新しく押されたタブがあれば、そちらを優先
    const app = $("#app"), changed = render.last !== view;
    if (!changed && !keepFocus && render.html === h) return;   // 中身が同じなら描き直さない（1分ごとの更新で重くならないように）
    render.html = h;
    app.innerHTML = h;
    if (t === "chat" && arg) { const ms = app.querySelectorAll(".msg"); ms.forEach((m, i) => { if (!changed || i < ms.length - 4) m.style.animation = "none"; }); }
    if (changed && !keepFocus) { app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); }
    if (t === "home" || !t) { const w = $("#rswipe"); if (w) { requestAnimationFrame(() => goStage(stageNow, true)); w.addEventListener("scroll", onStageScroll, { passive: true }); }
      }
    $("#scroll").classList.toggle("noscroll", t === "money");
    if (t === "money") moneyAfter();
    const ib = app.querySelector(".ibar"); $("#dock").replaceChildren(...(ib ? [ib] : []));   // 入力欄は動く画面の外に置く（開いた瞬間に上から落ちてこないように）
    if (t === "chat" && arg) { const m = $("#msg"); if (m) grow(m); if (changed) $("#scroll").scrollTop = 1e9; }
    else if (changed && !keepFocus) $("#scroll").scrollTop = 0;
    render.last = view;
    if (keepFocus) { const e = $("#q"); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }
  } catch (e) {
    if (my !== seq) return;
    $("#app").innerHTML = `<h1>ハコペン</h1><div class="card">管理表につながりませんでした。<br>${esc(e.message).slice(0, 120)}<br><br><button onclick="render(true)">もう一度</button></div>`;
  } finally { if (my === seq) { clearTimeout(slow); $("#pbar").classList.remove("on"); } }
}
window.addEventListener("hashchange", () => { sheetClose(); sel.on = false; sel.rows.clear(); render(false); });
setInterval(() => {   // 開いている間は1分ごとに裏で最新にする（引っぱって更新の代わり）
  if (document.hidden || !ss.get("session") || sel.on) return;
  ["売上", "買い手メッセージ", "無在庫商品リスト", "月別収支", "ジャンク品在庫"].forEach(n => { if (cache[n]) cache[n].at = 0; refreshBg(n); });
}, 60000);
setInterval(() => {   // 2026/11/14 トークを開いている間は、メッセージだけ20秒ごとに見る（届いたらすぐ出す）
  if (document.hidden || !ss.get("session") || sel.on || !location.hash.startsWith("#chat") || busyTyping()) return;
  if (cache["買い手メッセージ"]) cache["買い手メッセージ"].at = 0; refreshBg("買い手メッセージ");
}, 20000);
document.addEventListener("visibilitychange", () => {   // アプリに戻った瞬間にもメッセージを見る（通知から開いたとき）
  if (document.hidden || !ss.get("session")) return;
  if (cache["買い手メッセージ"]) cache["買い手メッセージ"].at = 0; refreshBg("買い手メッセージ");
});

let swiped = false;
(() => {   // AIの案は長押し（0.45秒）で入力欄へ。ふつうに触っただけでは何もしない
  let t = null, el = null;
  const end = () => { clearTimeout(t); t = null; if (el) el.classList.remove("hold"); el = null; };
  document.addEventListener("touchstart", e => { const g = e.target.closest("#sug"); if (!g || g.classList.contains("gone")) return;
    el = g; g.classList.add("hold"); t = setTimeout(() => { end(); if (navigator.vibrate) navigator.vibrate(15); useSug(); }, 450); }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(n => document.addEventListener(n, end, { passive: true }));
  document.addEventListener("contextmenu", e => { if (e.target.closest("#sug")) e.preventDefault(); });
})();
let openSw = null;   // 左にスワイプして開いている行
function closeSw() { if (!openSw) return; const r = openSw.querySelector(".lrow"); r.style.transform = ""; openSw.classList.remove("open", "right"); setTimeout(() => { if (!openSw || !openSw.classList.contains("open")) document.querySelectorAll(".sw.left:not(.open)").forEach(x => x.classList.remove("left")); }, 260); openSw = null; }
function swAct(btn, k) {
  const box = btn.closest(".sw"), rows = box.querySelector(".lrow").dataset.rows.split(",").map(Number);
  openSw = null;
  if (k === "unread") { const r = box.querySelector(".lrow"); r.style.transform = ""; box.classList.remove("open", "right");
    hiddenView ? unhide(rows) : markUnread(rows); return; }
  if (k === "del") delThread(box, rows);
  else { box.style.height = box.offsetHeight + "px"; box.classList.add("bye"); requestAnimationFrame(() => box.style.height = "0px");
    setTimeout(() => hiddenView ? unhide(rows) : fastSet("買い手メッセージ", rows.map(n => [n, B.read, "非表示"]), "非表示にしました"), 250); }
}
(() => {   // トーク一覧：右スワイプで「未読」ボタン（未読のトークは一発で既読）、左スワイプで「非表示・削除」ボタン
  const OPEN = -90, OPENR = 90;
  let row = null, x0 = 0, y0 = 0, dx = 0, base = 0, on = false;
  const shut = (p, r) => { r.style.transform = ""; p.classList.remove("open", "right"); if (openSw === p) openSw = null; setTimeout(() => p.classList.remove("left"), 260); };
  document.addEventListener("touchstart", e => {
    if (openSw && !e.target.closest(".sw.open .swdel, .sw.open .swbg")) { if (!e.target.closest(".sw.open")) { closeSw(); swiped = true; setTimeout(() => swiped = false, 350); return; } }
    if (e.target.closest(".swdel, .swbg")) return;
    const r = sel.on ? null : e.target.closest(".lrow"); row = r; on = false; dx = 0;
    if (r) { const p = r.parentNode; base = p.classList.contains("open") ? (p.classList.contains("right") ? OPENR : OPEN) : 0; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener("touchmove", e => { if (!row) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!on) { if (Math.abs(my) > 8 && Math.abs(my) * 1.2 > Math.abs(mx)) { row = null; return; } if (Math.abs(mx) > 24 && Math.abs(mx) > Math.abs(my) * 2) { on = true; x0 += mx > 0 ? 24 : -24; } else return; }
    dx = Math.max(OPEN - 30, Math.min(base + mx, OPENR + 40)); row.style.transition = "none"; row.style.transform = `translateX(${dx}px)`;
    row.parentNode.classList.toggle("left", dx < 0); }, { passive: true });
  document.addEventListener("touchend", () => { if (!row) return; const r = row; row = null;
    const p = r.parentNode; r.style.transition = "";
    if (!on) { if (base) { closeSw(); swiped = true; setTimeout(() => swiped = false, 350); } return; }
    swiped = true; setTimeout(() => swiped = false, 350);
    const rows = r.dataset.rows.split(",").map(Number);
    if (dx > 70 && base <= 0) {
      if (!hiddenView && Number(p.dataset.un)) { shut(p, r); readThread(rows); return; }   // 未読→その場で既読
      if (openSw && openSw !== p) closeSw();
      r.style.transform = `translateX(${OPENR}px)`; p.classList.add("open", "right"); p.classList.remove("left"); openSw = p;
    } else if (dx < -60 && base >= 0) {
      if (openSw && openSw !== p) closeSw();
      r.style.transform = `translateX(${OPEN}px)`; p.classList.add("open", "left"); p.classList.remove("right"); openSw = p;
    } else if ((base > 0 && dx > 40) || (base < 0 && dx < -100)) { r.style.transform = `translateX(${base}px)`; }
    else shut(p, r); }, { passive: true });
})();
async function delThread(box, rows) {   // トークを一覧から消す（シートの行も次の自動の回に消え、また入ってこない）
  if (!confirm("このトークを削除しますか？\n元に戻せません。")) { const r = box.querySelector(".lrow"); r.style.transform = ""; box.classList.remove("open"); setTimeout(() => box.classList.remove("left"), 260); return; }
  box.style.height = box.offsetHeight + "px"; box.classList.add("bye");
  requestAnimationFrame(() => { box.style.height = "0px"; });
  try { await setCells("買い手メッセージ", rows.flatMap(n => [[n, B.state, "削除"], [n, B.read, true], [n, B.send, false]])); setTimeout(() => render(false), 320); }
  catch (e) { toast(e.message); render(false); }
}
function unhide(rows) { return fastSet("買い手メッセージ", rows.map(n => [n, B.read, true]), "表示に戻しました"); }
async function markUnread(rows) {
  const v = cache["買い手メッセージ"] && cache["買い手メッセージ"].v; if (!v) return;
  const last = rows.filter(n => String(c(v[n - 1], B.qja) || c(v[n - 1], B.qen)).trim()).pop() || rows[rows.length - 1];
  fastSet("買い手メッセージ", [[last, B.read, "未読"]]);
}

async function checkVersion() {
  try { const v = (await (await fetch("version.txt?t=" + Date.now(), { cache: "no-store" })).text()).trim();
    if (v && v !== VERSION) location.reload(); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkVersion(); if (ss.get("session")) render(false); } });
checkVersion();
render(false);
if (ss.get("session")) ["売上", "買い手メッセージ", "無在庫商品リスト", "月別収支", "経費", "ジャンク品在庫"].forEach(n => tab(n).catch(() => {}));

// 11/13 本人：下のタブが上にずれないように（フクリと同じ）。ほかのアプリから戻った時・キーボードを閉じた時・画面の高さが変わった時に、ページを一番上に戻してタブを画面の一番下に置き直す
function fixNav(){window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;
  const n=document.getElementById('nav');if(n){n.style.top='';n.style.bottom=''}
  if(window.fitMoney)try{fitMoney()}catch(_){}}
const fixNavSoon=()=>[0,80,300,800].forEach(t=>setTimeout(fixNav,t));
['load','pageshow','orientationchange','resize','focus'].forEach(ev=>addEventListener(ev,fixNavSoon));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fixNavSoon()});
document.addEventListener('focusout',fixNavSoon);
if(window.visualViewport){visualViewport.addEventListener('resize',fixNav);visualViewport.addEventListener('scroll',()=>{if(!document.activeElement||!/INPUT|TEXTAREA/.test(document.activeElement.tagName))fixNav()})}
addEventListener('scroll',()=>{if(window.scrollY&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))fixNav()},{passive:true});
fixNav();
// 2026/11/14 本人：入力欄（メッセージを入力）を押したら、キーボードの上に入力欄と打っている文字が見えるようにする
(function(){
  let was=0;
  function kbFit(){
    const vv=window.visualViewport, f=document.activeElement;
    const on=!!(vv&&f&&f.closest&&f.closest('#dock'));
    const kb=on?Math.max(0,Math.round(window.innerHeight-(vv.offsetTop+vv.height))):0;
    document.body.style.setProperty('--kb',kb+'px');
    document.body.classList.toggle('kbon',kb>40);
    if(kb>40&&!was){const sc=document.getElementById('scroll');if(sc)sc.scrollTop=1e9}
    was=kb>40?1:0;
  }
  window.kbFit=kbFit;
  if(window.visualViewport){visualViewport.addEventListener('resize',()=>requestAnimationFrame(kbFit));visualViewport.addEventListener('scroll',()=>requestAnimationFrame(kbFit))}
  document.addEventListener('focusin',()=>[0,100,300,600].forEach(t=>setTimeout(kbFit,t)));
  document.addEventListener('focusout',()=>[50,300].forEach(t=>setTimeout(kbFit,t)));
})();
